    <script>
      function applyTheme(theme) {
        if (theme === "system") {
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
        } else {
          document.documentElement.setAttribute("data-theme", theme);
        }
      }

      // Read saved preference or default to 'system'
      const savedTheme = localStorage.getItem("app-theme") || "system";
      applyTheme(savedTheme);

      // Listen for system theme changes dynamically if on 'system' mode
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
        if ((localStorage.getItem("app-theme") || "system") === "system") {
          applyTheme("system");
        }
      });

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              stage: {
                bg: "#0f172a",
                card: "#1e293b",
                accent: "#38bdf8",
                chord: "#f59e0b",
                capoChord: "#a855f7",
                chorusBg: "#1e2942"
              }
            }
          }
        }
      };
    </script>

            <div id="transpose-container"></div>
            <div id="song-editor-container"></div>
